[project]
name = "sidrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Siddarth Singh", email = "96046931+siddarthsingh24@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.16.0",
    "ipykernel>=7.3.0",
    "langchain>=1.4.10",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.7",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "pymupdf>=1.28.2",
    "pypdf>=7.0.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "typesense>=2.1.1",
]

[project.scripts]
sidrag = "sidrag:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
